name: release

# 发布 Windows 安装包到 GitHub Release。
#
# 为什么在 CI 构建：electron-builder 的 NSIS 目标需要**执行**它刚编译出的安装器桩
# 来生成卸载器（NsisTarget 里 execWine(installerPath)）。本机若处于非交互/受限桌面，
# 这一步会被系统以 ERROR_CANCELLED(0x800704C7) 拒绝，退出码 2。GitHub 的 windows
# runner 允许执行，因此发布放在这里做。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（如 v2.6.3）'
        required: true
        default: 'v2.6.3'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # afterPack 需要 rcedit 写图标与版本信息；CI 上没有 electron-builder 的
      # winCodeSign 缓存，这里显式下载并通过 MOSSY_RCEDIT 指给 after-pack.cjs。
      - name: Fetch rcedit
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe' -OutFile 'rcedit-x64.exe'
          "MOSSY_RCEDIT=$((Get-Location).Path)\rcedit-x64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      # CI 环境下 electron-builder 默认会尝试自行发布（要求 GH_TOKEN）。
      # 这里只负责打包，发布交给下面的 action-gh-release。
      - name: Package installers
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem release -Filter '*.exe' | Select-Object Name, Length | Format-Table -AutoSize

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: 晓山青 ${{ github.event.inputs.tag }}
          body: |
            晓山青 Viridiore ${{ github.event.inputs.tag }}

            - **桌面应用内更新**：内置 electron-updater，从 GitHub Releases 检查并后台下载、重启安装（NSIS 安装版；便携版需手动更新）
            - **手机端**：应用内检查更新 + 一键下载；可选 Capgo 静默热更新网页层（Android / iOS）
            - 追光分级改为「按模式可行区间」：云海 / 星空的高位也能显示「值得去」，概率数值本身不变
            - 台账新增先验重估机制（`npm run ledger:prior`，样本达标才生效）
            - 新增 版本比较 / 更新 / 先验 相关单元测试
          files: |
            release/XiaoShanQing-*-Setup-x64.exe
            release/XiaoShanQing-*-Portable-x64.exe
            release/latest.yml
            release/*.blockmap
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
