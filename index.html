<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#12241a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)" />
  <meta name="description" content="晓山青 Viridiore — 户外智能出行伴侣：天气、追光、轨迹，离线可用" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="晓山青" />
  <meta name="format-detection" content="telephone=no" />
  <title>晓山青 · 户外智能出行伴侣</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />

  <!-- ============================================================
       启动闪屏「破晓山谷」加载动画
       内联为关键 CSS：不依赖 JS 加载的样式表，首帧即可正确渲染，
       避免白屏/无样式闪烁。字体与颜色全部使用字面值以保证自足。
       ============================================================ -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      background:
        radial-gradient(120% 80% at 50% 84%, rgba(168, 121, 74, 0.55), transparent 60%),
        linear-gradient(170deg, #0b1711 0%, #16301f 45%, #3c5f42 78%, #a8794a 100%);
      opacity: 1;
      visibility: visible;
      transition: opacity 0.52s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.52s;
      -webkit-tap-highlight-color: transparent;
    }
    #boot-splash.is-hidden { opacity: 0; visibility: hidden; }
    #boot-splash *,
    #boot-splash *::before,
    #boot-splash *::after { box-sizing: border-box; }

    /* 太阳：光核 + 旋转光环 */
    .boot-sun {
      position: absolute;
      top: 42%;
      left: 50%;
      width: 180px;
      height: 180px;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
    }
    .boot-sun__core {
      width: clamp(90px, 23vmin, 140px);
      height: clamp(90px, 23vmin, 140px);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 44%, #ffe9bf, #f2bd77 46%, #e6a457 62%, rgba(217, 138, 56, 0) 74%);
      filter: blur(2px);
      animation: bootSun 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite alternate;
    }
    .boot-sun__ring {
      position: absolute;
      width: clamp(120px, 32vmin, 180px);
      height: clamp(120px, 32vmin, 180px);
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(255, 225, 173, 0) 0deg,
        rgba(255, 225, 173, 0) 200deg,
        rgba(255, 225, 173, 0.9) 330deg,
        rgba(255, 225, 173, 0) 360deg
      );
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
      animation: bootRing 2.8s linear infinite;
    }

    /* 山脊剪影 */
    .boot-ridge {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: 0;
    }
    .boot-ridge--far {
      height: 34%;
      background: #1c3527;
      opacity: 0.9;
      clip-path: polygon(0 62%, 14% 40%, 26% 56%, 41% 26%, 55% 50%, 68% 32%, 82% 52%, 100% 34%, 100% 100%, 0 100%);
    }
    .boot-ridge--near {
      height: 26%;
      background: #0a1710;
      clip-path: polygon(0 74%, 18% 48%, 34% 68%, 52% 40%, 70% 66%, 86% 46%, 100% 64%, 100% 100%, 0 100%);
    }

    /* 品牌字 */
    .boot-brand {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      pointer-events: none;
    }
    .boot-title {
      font-family: "Songti SC", "Source Han Serif SC", "Noto Serif SC", "STSong", Georgia, serif;
      font-size: clamp(30px, 8vmin, 42px);
      line-height: 1.1;
      letter-spacing: 0.32em;
      text-indent: 0.32em;
      color: #f7f3e6;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.5);
      animation: bootTitle 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .boot-sub {
      font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      color: rgba(247, 243, 230, 0.6);
      animation: bootSub 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
    }

    /* 加载条 */
    .boot-loader {
      position: absolute;
      left: 50%;
      bottom: clamp(46px, 14%, 120px);
      transform: translateX(-50%);
      z-index: 3;
      width: min(58vw, 230px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: bootFade 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }
    .boot-loader__track {
      position: relative;
      width: 100%;
      height: 3px;
      border-radius: 999px;
      background: rgba(247, 243, 230, 0.16);
      overflow: hidden;
    }
    .boot-loader__bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 44%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(242, 201, 138, 0), #ffe1a8 40%, #f0b268 72%, rgba(240, 178, 104, 0));
      animation: bootBar 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    .boot-loader__text {
      font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: rgba(247, 243, 230, 0.72);
      animation: bootTextPulse 1.9s ease-in-out infinite;
    }

    @keyframes bootSun {
      from { transform: translateY(14px) scale(0.94); opacity: 0.8; }
      to   { transform: translateY(-6px) scale(1.05); opacity: 1; }
    }
    @keyframes bootRing { to { transform: rotate(360deg); } }
    @keyframes bootTitle {
      from { opacity: 0; transform: translateY(10px); letter-spacing: 0.6em; }
      to   { opacity: 1; transform: none; letter-spacing: 0.32em; }
    }
    @keyframes bootSub {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes bootFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes bootBar {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(240%); }
    }
    @keyframes bootTextPulse {
      0%, 100% { opacity: 0.5; }
      50%      { opacity: 0.95; }
    }

    /* 尊重系统「减少动态效果」设置 */
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .boot-sun__core,
      #boot-splash .boot-sun__ring,
      #boot-splash .boot-title,
      #boot-splash .boot-sub,
      #boot-splash .boot-loader,
      #boot-splash .boot-loader__bar,
      #boot-splash .boot-loader__text { animation: none !important; }
      #boot-splash .boot-loader__bar { width: 100%; opacity: 0.6; transform: none; }
      #boot-splash .boot-title { letter-spacing: 0.32em; }
    }
  </style>
</head>
<body>
  <div id="boot-splash" aria-hidden="true">
    <div class="boot-sun">
      <span class="boot-sun__ring"></span>
      <span class="boot-sun__core"></span>
    </div>
    <div class="boot-ridge boot-ridge--far"></div>
    <div class="boot-ridge boot-ridge--near"></div>

    <div class="boot-brand">
      <div class="boot-title">晓山青</div>
      <div class="boot-sub">VIRIDIORE</div>
    </div>

    <div class="boot-loader">
      <div class="boot-loader__track"><span class="boot-loader__bar"></span></div>
      <div class="boot-loader__text">正在准备今日的山野</div>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
